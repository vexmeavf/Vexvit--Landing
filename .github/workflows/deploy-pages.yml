name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage the repository root
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prefer the main branch root as the publishing source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "page_url=${{ steps.deployment.outputs.page_url }}"
          gh api --method PUT "repos/${REPO}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/" || true
          gh api "repos/${REPO}/pages" || true
